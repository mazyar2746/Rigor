name: Build Rigor APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle* | sed -E 's/.*versionName[[:space:]]*"?([^"]+)"?.*/\1/' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p release-out
          cp ${{ steps.sign.outputs.signedReleaseFile }} release-out/Rigor-${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}
          name: Rigor v${{ steps.version.outputs.version }} (${{ steps.version.outputs.date }})
          body: |
            ✅ بیلد خودکار Rigor
            - نسخه: ${{ steps.version.outputs.version }}
            - تاریخ: ${{ steps.version.outputs.date }}
            - بخش‌ها: کریپتو، بورس، فارکس
          files: release-out/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
